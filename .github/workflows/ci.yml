name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate Prisma client (framework source)
        run: npx prisma generate --schema=prisma/schema.postgresql.prisma
        env:
          DB_PROVIDER: postgresql
      - run: npm run typecheck
      - run: npm test -- --ci

  package-smoke:
    name: Packed CLI and generated applications
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke" --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Smoke test (pack → install outside repo → generate → install → typecheck → build → start)
        run: npm run test:smoke
        env:
          SMOKE_REQUIRE_START: "1"
          SMOKE_PG_URL: postgresql://smoke:smoke@127.0.0.1:5432
          SMOKE_MONGO_URL: mongodb://127.0.0.1:27017
          SMOKE_REDIS_HOST: 127.0.0.1
          SMOKE_REDIS_PORT: "6379"
